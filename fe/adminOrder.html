<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Dashboard</title>
    <link rel="stylesheet" href="adminOrder.css">
</head>

<body>
    <header>
        <div class="navbar">
          <div class="container">
            <div class="nav-container">
              <div class="home">
                <a href="#">
                  <img src="./asset/logo.png" alt="Home" />
                  <p>BLUE LOCK</p>
                </a>
              </div>
              <div class="nav-search">
                  <div class="search">
                      <input type="text" placeholder="Search..." />
                      <button>
                        <img src="./asset/search.png" alt="Search" />
                      </button>
                    </div>
              </div>
              <div class="nav-wrapper">
                  <div class="cart">
                      <a href="#">
                        <img src="./asset/cart.png" alt="Cart" />
                      </a>
                    </div>
                    <div class="login">
                      <a href="#">
                        <img src="./asset/avatar.png" alt="Avatar" />
                      </a>
                      <div class="login-wrapper">
                          <div class="login-content">
                              <div class="content-item"><a href="#">Profile</a></div>
                              <div class="content-item"><a href="#">Change password</a></div>
                              <div class="content-item"><a href="#">Log out</a></div>
                          </div>
                      </div>
                    </div>
              </div>
            </div>
          </div>
        </div>
      </header>

    <div class="content">
        <div class="container">
            <!-- Sidebar -->
            <div class="sidebar">
                <ul>
                    <li><strong>Dashboard</strong></li>
                    <li>User</li>
                    <li>Product</li>
                    <li>Item</li>
                    <li>Order</li>
                    <li>Review</li>
                </ul>
            </div>
    
            <!-- Main Content -->
            <div class="main-content">
                <div class="header">
                    <h2>Total: 1</h2>
                </div>
    
                <div class="status-filter">
                    <label for="status-filter">Filter by Status:</label>
                    <select id="status-filter">
                        <option value="all">All</option>
                        <option value="Completed">Completed</option>
                        <option value="Pending">Pending</option>
                        <!-- Add other statuses here if needed -->
                    </select>
                </div>
    
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>User</th>
                            <th>Created on</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td><img src="./asset/product.png" alt="Product" class="product-image"> Product name</td>
                            <td>User 1</td>
                            <td>2025-xx-xx</td>
                            <td>2000 VND</td>
                            <td>Completed</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td><img src="./asset/product.png" alt="Product" class="product-image"> Product name</td>
                            <td>User 1</td>
                            <td>2025-xx-xx</td>
                            <td>2000 VND</td>
                            <td>Completed</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    

    <script src="./adminOrder.js"></script>
</body>

</html>
